<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ACCESS DENIED</title><link rel="stylesheet" href="theme.css">
<style>
  body { height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card { position:relative; width:min(680px,92vw); padding:48px 40px; text-align:center;
    background:linear-gradient(135deg,#14141e,#0a0a10); box-shadow:inset 4px 0 0 var(--red);
    clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px)); }
  .card::after { content:""; position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--red),transparent);
    top:0; animation:scan 3.2s linear infinite; opacity:.7; }
  @keyframes scan { to { top:100%; } }
  .emblem { width:90px; height:90px; margin:0 auto 10px; }
  .tag { font-size:12px; letter-spacing:.5em; color:var(--red); }
  h1 { font-size:clamp(40px,8vw,74px); font-weight:800; letter-spacing:.12em; margin:8px 0; position:relative;
    text-shadow:2px 0 var(--red), -2px 0 var(--cyan); animation:glitch 4s infinite; }
  @keyframes glitch { 0%,92%,100% { text-shadow:2px 0 var(--red),-2px 0 var(--cyan); transform:none; }
    94% { text-shadow:-5px 0 var(--red),5px 0 var(--cyan); transform:translateX(3px); } 96% { text-shadow:5px 0 var(--red),-5px 0 var(--cyan); transform:translateX(-3px); } }
  #site { font-size:20px; color:var(--cyan); letter-spacing:.25em; text-shadow:0 0 12px #00e5ff88; margin-top:6px; }
  #timer { display:inline-block; margin-top:28px; padding:10px 22px; font-size:18px; letter-spacing:.22em; color:var(--red);
    box-shadow:inset 0 0 0 1px #ff1a3c88; clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); }
  #quote { margin-top:26px; color:var(--mut); font-size:14px; letter-spacing:.12em; }
</style></head>
<body>
  <div class="card">
    <div class="emblem" id="emb"></div>
    <div class="tag">// DISTRACTION INTERCEPTED</div>
    <h1>ACCESS DENIED</h1>
    <div id="site"></div>
    <div id="timer">LOCK ENGAGED</div>
    <div id="quote"></div>
  </div>
  <script src="shared.js"></script><script src="blocked.js"></script>
</body></html>
